# Copy to /etc/nginx/sites-available/flintworks.hu on the VPS, then:
#   sudo ln -s /etc/nginx/sites-available/flintworks.hu /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# First-time SSL (Certbot will add the 443 blocks and redirects):
#   sudo certbot --nginx -d flintworks.hu -d www.flintworks.hu

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.flintworks.hu;
    return 301 https://flintworks.hu$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name flintworks.hu;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Tells the frontend which language to default to (HU IP -> hu, else en).
        # $fw_geo_cookie comes from /etc/nginx/conf.d/geo-hu.conf (update-geo-hu.sh).
        add_header Set-Cookie $fw_geo_cookie always;
    }
}
