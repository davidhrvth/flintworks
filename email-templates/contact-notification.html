<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Contact Form Submission — Flintworks</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0A0A0B; font-family: 'Syne', 'Inter', Arial, sans-serif;">

  <!-- Outer wrapper -->
  <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0A0A0B;">
    <tr>
      <td align="center" style="padding: 40px 16px;">

        <!-- Email card — max 600px -->
        <table border="0" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; width: 100%; background-color: #111114; border: 1px solid #1E1E24; border-radius: 8px; overflow: hidden;">

          <!-- Header -->
          <tr>
            <td align="center" style="padding: 36px 40px 28px 40px; border-bottom: 1px solid #1E1E24;">
              <table border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 22px; font-weight: 700; color: #F0F0F5; letter-spacing: 0.12em; text-transform: uppercase;">FLINTWORKS</span>
                    <span style="font-size: 18px; color: #FF4D00; margin-left: 6px;">✦</span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Alert banner -->
          <tr>
            <td style="padding: 0;">
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="background-color: #FF4D00; padding: 10px 40px;">
                    <p style="margin: 0; font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 12px; font-weight: 700; color: #F0F0F5; letter-spacing: 0.1em; text-transform: uppercase;">&#9679; New Contact Submission</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding: 40px 40px 32px 40px;">

              <!-- Intro -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%">
                <tr>
                  <td style="padding-bottom: 28px;">
                    <h1 style="margin: 0 0 8px 0; font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 22px; font-weight: 700; color: #F0F0F5; line-height: 1.3;">
                      {{name}} just submitted the contact form.
                    </h1>
                    <p style="margin: 0; font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 14px; color: #C4C4CF; line-height: 1.6;">
                      Full submission details below. Respond within 24 hours.
                    </p>
                  </td>
                </tr>
              </table>

              <!-- Data table -->
              <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: #0A0A0B; border: 1px solid #1E1E24; border-radius: 6px;">
                <tr>
                  <td style="padding: 24px 28px;">

                    <!-- Name -->
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 18px;">
                      <tr>
                        <td width="120" valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 11px; font-weight: 700; color: #FF4D00; letter-spacing: 0.08em; text-transform: uppercase;">Name</span>
                        </td>
                        <td valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 14px; color: #F0F0F5;">{{name}}</span>
                        </td>
                      </tr>
                    </table>
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 18px;"><tr><td style="border-top: 1px solid #1E1E24; font-size: 0; line-height: 0;">&nbsp;</td></tr></table>

                    <!-- Email -->
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 18px;">
                      <tr>
                        <td width="120" valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 11px; font-weight: 700; color: #FF4D00; letter-spacing: 0.08em; text-transform: uppercase;">Email</span>
                        </td>
                        <td valign="top">
                          <a href="mailto:{{email}}" style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 14px; color: #FF4D00; text-decoration: underline;">{{email}}</a>
                        </td>
                      </tr>
                    </table>
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 18px;"><tr><td style="border-top: 1px solid #1E1E24; font-size: 0; line-height: 0;">&nbsp;</td></tr></table>

                    <!-- Company -->
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 18px;">
                      <tr>
                        <td width="120" valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 11px; font-weight: 700; color: #FF4D00; letter-spacing: 0.08em; text-transform: uppercase;">Company</span>
                        </td>
                        <td valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 14px; color: #F0F0F5;">{{company}}</span>
                        </td>
                      </tr>
                    </table>
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 18px;"><tr><td style="border-top: 1px solid #1E1E24; font-size: 0; line-height: 0;">&nbsp;</td></tr></table>

                    <!-- Service -->
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 18px;">
                      <tr>
                        <td width="120" valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 11px; font-weight: 700; color: #FF4D00; letter-spacing: 0.08em; text-transform: uppercase;">Service</span>
                        </td>
                        <td valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 14px; color: #F0F0F5;">{{service}}</span>
                        </td>
                      </tr>
                    </table>
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="margin-bottom: 18px;"><tr><td style="border-top: 1px solid #1E1E24; font-size: 0; line-height: 0;">&nbsp;</td></tr></table>

                    <!-- Message -->
                    <table border="0" cellpadding="0" cellspacing="0" width="100%">
                      <tr>
                        <td width="120" valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 11px; font-weight: 700; color: #FF4D00; letter-spacing: 0.08em; text-transform: uppercase;">Message</span>
                        </td>
                        <td valign="top">
                          <span style="font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 14px; color: #C4C4CF; line-height: 1.7;">{{message}}</span>
                        </td>
                      </tr>
                    </table>

                  </td>
                </tr>
              </table>

              <!-- CTA button -->
              <table border="0" cellpadding="0" cellspacing="0" style="margin-top: 32px;">
                <tr>
                  <td align="center" style="background-color: #FF4D00; border-radius: 5px;">
                    <a href="mailto:{{email}}" style="display: inline-block; padding: 14px 32px; font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 14px; font-weight: 700; color: #F0F0F5; text-decoration: none; letter-spacing: 0.08em; text-transform: uppercase;">Reply to {{name}}</a>
                  </td>
                </tr>
              </table>

            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding: 24px 40px; border-top: 1px solid #1E1E24;">
              <p style="margin: 0; font-family: 'Syne', 'Inter', Arial, sans-serif; font-size: 12px; color: #C4C4CF; opacity: 0.5;">Internal notification · Flintworks CRM</p>
            </td>
          </tr>

        </table>
        <!-- /Email card -->

      </td>
    </tr>
  </table>

</body>
</html>
